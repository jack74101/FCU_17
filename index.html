.research-phase-strip .phase{display:grid;grid-template-columns:auto 1fr;align-content:center;align-items:center;column-gap:9px;row-gap:4px;padding:9px 12px;border:1px solid #d3dedc;border-radius:10px;background:#f9fbfa;min-height:62px}
.research-phase-strip .phase:nth-child(2){background:#edf3fa;border-color:#ccd9ea}

.research-phase-strip .phase-id{font:700 13px/1 'JetBrains Mono',monospace;color:#81929a}
.research-phase-strip strong{font-size:clamp(17px,1.12vw,23px);color:var(--text-main)}
.research-phase-strip .phase>span:last-child{grid-column:1/-1;font-size:clamp(13px,.87vw,17px);font-weight:550;color:#526973;white-space:nowrap}

}
@media(max-width:900px){

}

 #print-root .card-title {font-size:20px!important;line-height:1.35!important; margin-bottom:10px!important;}
 #print-root .detail {min-height:0!important;padding:17px!important;}

 #print-root .feature-stat {padding:14px 15px!important;}

 #print-root .hero-card {min-height:0!important;}
 #print-root .fcu-cover {flex:1 1 auto!important;min-height:0!important;}

 #print-root .page *,#print-root .page *::before,#print-root .page *::after {

 }

/* CH03: task-specific Agent roles, human checkpoints, and high-risk safeguards. */
.page[data-index="2"] .agent-workflow{display:flex;flex-direction:column;gap:9px;min-width:0;padding:clamp(13px,1.05vw,17px)}
.agent-workflow-header{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.agent-workflow-kicker{font-size:clamp(13px,.96vw,17px);font-weight:850;letter-spacing:.025em;color:#6b3440}
.agent-mode-tabs{display:flex;gap:5px;flex-wrap:wrap}
.page[data-index="2"] .agent-mode-tabs .mini-tab{font-size:clamp(12px,.9vw,15px);padding:6px 9px}
.agent-step-overview{display:grid;grid-template-columns:clamp(50px,5.0vw,78px) minmax(0,1fr);align-items:center;gap:11px;background:#f8fafb;border:1px solid var(--border-line);border-radius:11px;padding:11px 12px}
.agent-step-number{font-family:'JetBrains Mono',monospace;font-weight:850;font-size:clamp(35px,3.3vw,55px);line-height:1;color:var(--primary)}
.agent-step-overview strong{display:block;font-size:clamp(21px,1.7vw,28px);line-height:1.15;margin-bottom:4px}
.agent-step-overview span:not(.agent-step-number){display:block;font-size:clamp(15px,1.06vw,18px);line-height:1.35;color:var(--text-muted)}
.agent-roles{display:grid;grid-template-rows:repeat(3,minmax(0,1fr));gap:8px;flex:1;min-height:0}
.agent-role{display:grid;grid-template-columns:clamp(74px,5.7vw,95px) minmax(0,1fr);align-items:center;gap:9px;border-radius:10px;border:1px solid var(--border-line);border-left:4px solid #afb9c0;padding:10px 11px;min-width:0}
.agent-role b{font-size:clamp(15px,1.05vw,18px);line-height:1.3;white-space:normal}
.agent-role span{font-size:clamp(15px,1.04vw,18px);line-height:1.43;color:#243843}
.agent-role.role-ai{background:#e8f4f0;border-left-color:var(--secondary)}
.agent-role.role-ai b{color:var(--secondary)}
.agent-role.role-human{background:#edf3fa;border-left-color:var(--accent-blue)}
.agent-role.role-human b{color:var(--accent-blue)}
.agent-role.role-risk{background:#fff3e9;border-left-color:var(--accent-orange)}
.agent-role.role-risk b{color:#b45c30}
.agent-evidence{display:grid;grid-template-columns:auto minmax(0,1fr);gap:9px;align-items:center;border:1px dashed #c5d3d7;background:#f8fbfb;border-radius:9px;padding:10px 11px}
.agent-evidence strong{color:var(--primary);font-size:clamp(14px,1.01vw,18px);white-space:nowrap}
.agent-evidence span{font-size:clamp(14px,1.0vw,17px);line-height:1.35}
.agent-bookline{border-top:1px solid var(--border-line);padding-top:9px;font-size:clamp(13px,.95vw,16px);line-height:1.4;color:#596b74}
.agent-bookline b:first-child{color:var(--primary)}
.agent-risk-panel{display:flex;flex-direction:column;gap:9px;flex:1;min-height:0}
.agent-risk-title{font-weight:850;font-size:clamp(19px,1.45vw,25px);display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.agent-risk-list{display:grid;grid-template-rows:repeat(5,minmax(0,1fr));gap:7px;flex:1;min-height:0}
.agent-risk-row{display:grid;grid-template-columns:clamp(100px,8vw,150px) minmax(0,1fr);align-items:center;gap:10px;border:1px solid #dce3e7;border-radius:9px;padding:9px 11px;background:#f8fafb}
.agent-risk-row b{color:var(--primary);font-size:clamp(15px,1.1vw,19px)}
.agent-risk-row span{font-size:clamp(15px,1.05vw,18px);line-height:1.38}
.agent-references{font-size:12px;color:var(--text-muted)}
.agent-references a{color:var(--accent-blue);text-decoration:underline;text-underline-offset:2px}
@media (min-width:901px){.page[data-index="2"] .main-grid{grid-template-columns:minmax(0,1.47fr) minmax(360px,.89fr);gap:12px}}
@media (min-width:901px) and (max-height:810px){

}

 #print-root .page[data-index="2"] .main-grid{grid-template-columns:minmax(0,1.47fr) minmax(355px,.89fr)!important;gap:12px!important}
 #print-root .page[data-index="2"] .agent-step-overview{padding:8px 10px!important}
 #print-root .page[data-index="2"] .agent-role{padding:7px 10px!important}
 #print-root .page[data-index="2"] .agent-evidence{padding:8px 10px!important}

}

/* CH04 / CH05 / CH07 case-specific AI Agent research extension. */
.case-stage-left,.gate-stage-left,.knowledge-stage-left{gap:9px;min-width:0}
.case-domain-switch .mini-tab{font-size:clamp(14px,1.05vw,17px);padding:8px 11px}
.case-diagram,.gate-diagram{flex:1 1 0;min-height:130px;max-height:330px;object-fit:contain}
.case-summary-track{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
.case-track-item{border:1px solid var(--border-line);border-radius:10px;padding:9px 7px;background:#f8fafb;display:flex;align-items:center;gap:6px;color:var(--text-main);min-width:0;text-align:left;transition:.2s}
.case-track-item span{font:800 13px/1 'JetBrains Mono',monospace;color:var(--primary)}
.case-track-item b{font-size:clamp(12px,.9vw,16px);line-height:1.3}
.case-track-item.is-current{border-color:#c99292;background:var(--primary-soft)}
.case-bookline,.gate-bookline{font-size:clamp(15px,1.04vw,18px);line-height:1.45;background:#f8fafb;border:1px solid var(--border-line);border-radius:9px;padding:11px 13px}
.case-agent-panel,.gate-agent-panel,.knowledge-agent-panel{min-width:0;min-height:0;display:flex;flex-direction:column;gap:9px}
.case-panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex:0 0 auto}
.case-panel-step{font-size:clamp(15px,1.04vw,19px);font-weight:850;color:var(--primary)}
.case-agent-panel h2,.gate-agent-panel h2,.knowledge-agent-panel h2{font-size:clamp(24px,1.82vw,33px);line-height:1.2;margin:0;font-weight:850}
.case-agent-grid{display:grid;grid-template-rows:repeat(3,minmax(0,1fr));gap:8px;flex:1 1 0;min-height:0}
.case-agent-row{display:grid;grid-template-columns:minmax(82px,23%) minmax(0,1fr);align-items:center;gap:11px;padding:10px 12px;border:1px solid var(--border-line);border-left:4px solid #b2c6c3;border-radius:9px;background:#fff;min-height:0}
.case-agent-row b{font-size:clamp(15px,1.04vw,19px);line-height:1.3;color:#1a2b36}
.case-agent-row span{font-size:clamp(15px,1.01vw,18px);line-height:1.42}
.case-agent-row.is-can{border-left-color:#305f9b;background:#f4f8fd}
.case-agent-row.is-verify{border-left-color:#18766c;background:#f1f8f5}
.case-agent-row.is-risk{border-left-color:#d66a3b;background:#fff7f2}
.case-evidence{display:grid;grid-template-columns:minmax(82px,23%) minmax(0,1fr);gap:11px;align-items:center;border:1px solid #b6d8ce;background:#e8f4f0;border-radius:9px;padding:11px 12px}
.case-evidence b{color:#18766c;font-size:clamp(15px,1vw,18px)}
.case-evidence span{font-size:clamp(15px,1.01vw,18px);line-height:1.4}
.case-human,.gate-failure{display:flex;gap:8px;align-items:flex-start;border-left:4px solid var(--primary);padding:10px 12px;background:var(--primary-soft);border-radius:0 8px 8px 0;font-size:clamp(14px,.96vw,17px);line-height:1.38}
.case-human strong,.gate-failure b{min-width:100px;flex:none;color:var(--primary)}
.gate-stage-left .outcome-panel{flex:0 0 auto;min-height:78px}
.gate-agent-panel .gate-bookline{padding:9px 11px}
.gate-failure{background:#f7f8f9;border-left-color:#bdc5c9}
.gate-failure.emphasized{background:#fff2e9;border-left-color:#d66a3b}
.gate-mini-tabs{display:flex;gap:5px;flex-wrap:wrap}
.gate-mini-tabs .mini-tab{padding:6px 8px;font-size:clamp(13px,.94vw,15px)}

.knowledge-stage-left .compare-table td{padding:clamp(14px,1.15vw,21px) 13px}

.knowledge-criterion-explain{font-size:clamp(15px,1.08vw,19px);line-height:1.4;color:var(--text-muted);border-bottom:1px solid var(--border-line);padding-bottom:8px}

/* On 720p projectors, keep CH07 fully visible at 100% zoom without shrinking body text. */
@media (min-width:901px) and (max-height:740px){
 .presentation-main .page[data-index="6"]{gap:5px}
 .presentation-main .page[data-index="6"] .main-grid{gap:9px}
 .presentation-main .page[data-index="6"] .card{padding:11px}
 .presentation-main .page[data-index="6"] .compare-table td{padding:7px 8px}
 .presentation-main .page[data-index="6"] .compare-table th{padding:8px 9px}
 .presentation-main .page[data-index="6"] .case-agent-row{padding:5px 8px}
 .presentation-main .page[data-index="6"] .case-evidence{padding:6px 8px}
 .presentation-main .page[data-index="6"] .knowledge-case-block{padding:6px 8px}
 .presentation-main .page[data-index="6"] .knowledge-quote{padding:6px 8px}
 .presentation-main .page[data-index="6"] .knowledge-diagram{min-height:75px}
}
  
/* CH06 - evidence ladder / 2026 independently sourced overlay */
.ch06-main{grid-template-columns:minmax(0,1.35fr) minmax(360px,.92fr);gap:13px;align-items:stretch}
.ch06-main>.card{min-height:0}
.ch06-visual{display:flex;flex-direction:column;gap:13px}
.ch06-panel-heading{display:flex;justify-content:space-between;align-items:center;gap:7px;flex-wrap:wrap;min-width:0}
.ch06-panel-heading>strong{font-size:clamp(18px,1.45vw,25px);line-height:1.2}
.ch06-guide{font-size:clamp(11px,.77vw,15px);color:var(--text-muted)}
.ch06-switch{display:flex;align-items:center;gap:6px;padding:4px;background:#f2f4f5;border:1px solid #e0e4e5;border-radius:10px;width:max-content;max-width:100%}
.ch06-switch-btn{border:0;background:none;color:var(--text-muted);font-weight:800;border-radius:7px;font-size:clamp(12px,.98vw,17px);padding:8px 13px;white-space:nowrap;transition:background .2s,color .2s,box-shadow .2s}
.ch06-switch-btn.chosen{background:#fff;color:var(--primary);box-shadow:0 2px 8px #28343d18}
.ch06-chain{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;min-height:0;flex:1}
.ch06-level{position:relative;text-align:left;display:flex;flex-direction:column;align-items:flex-start;min-width:0;min-height:182px;padding:14px 12px 12px;border-radius:13px;border:1.5px solid #dbe2e5;background:#fff;box-shadow:0 3px 10px #273d4810;transition:transform .2s,border-color .2s,background .2s}
.ch06-level:focus-visible{outline:3px solid #6f9ec0;outline-offset:2px}
.ch06-level.selected{border:2px solid var(--primary);background:var(--primary-soft);box-shadow:0 6px 20px #7d212a1c;transform:translateY(-3px)}
.ch06-level:hover{transform:translateY(-2px)}
.ch06-level-number{font-size:clamp(12px,.98vw,18px);letter-spacing:.05em;color:var(--text-muted);width:100%;display:flex;justify-content:space-between;align-items:center}
.ch06-level-status{display:inline-block;width:8px;height:8px;border-radius:50%;background:#c0c6c8}
.ch06-level-status.verified{background:#18766c}.ch06-level-status.pending{background:#d66a3b}.ch06-level-status.historic{background:#7d212a}
.ch06-level-title{font-size:clamp(15px,1.23vw,22px);font-weight:850;margin-top:12px;line-height:1.25}
.ch06-level-value{color:var(--primary);font-size:clamp(17px,1.55vw,28px);font-weight:900;line-height:1.23;margin-top:auto;padding-top:9px;overflow-wrap:anywhere}
.ch06-level-hint{color:var(--text-muted);font-size:clamp(10px,.78vw,14px);line-height:1.32;margin-top:6px}
.ch06-flow-track{height:9px;display:grid;grid-template-columns:repeat(4,1fr);gap:5px;align-items:center;padding:0 10px;opacity:.82}
.ch06-flow-track span{height:3px;display:block;background:repeating-linear-gradient(90deg,#cfa0a4 0 10px,transparent 10px 18px);background-size:32px 3px;border-radius:3px;animation:ch06-move 1.8s linear infinite}
@keyframes ch06-move{to{background-position:32px 0}}
.ch06-statement{padding:15px 17px;background:#f8eaeb;border:1px solid #eccdcf;border-radius:12px;display:flex;flex-direction:column;gap:6px}
.ch06-statement strong{font-size:clamp(19px,1.45vw,27px);color:var(--primary);line-height:1.25}
.ch06-statement span{font-size:clamp(14px,1.07vw,21px);line-height:1.3;color:#73464b;font-weight:700}
.ch06-context{padding:11px 13px;background:#f2f6fa;border:1px solid #e0e8ec;border-left:4px solid var(--accent-blue);border-radius:9px;display:flex;gap:10px;align-items:baseline;line-height:1.4}
.ch06-context.historic{background:#faf4f1;border-color:#f0e1d8;border-left-color:#cb7049}
.ch06-context b{font-size:clamp(12px,.93vw,17px);flex-shrink:0;color:#305f9b}
.ch06-context.historic b{color:#9c5139}
.ch06-context span{font-size:clamp(12px,.91vw,16px);color:#475e6d}
.ch06-detail-card{display:flex;flex-direction:column;gap:10px;min-width:0}
.ch06-step-label{font-size:clamp(12px,.93vw,16px);letter-spacing:.035em;color:var(--text-muted)}
.ch06-detail-card h2{font-size:clamp(19px,1.44vw,26px);line-height:1.25;margin:0;letter-spacing:-.02em}
.ch06-detail-card .tag{font-size:clamp(10px,.83vw,13px);padding:3px 7px}
.ch06-headline{font-size:clamp(39px,3.7vw,65px);font-weight:900;color:var(--primary);letter-spacing:-.055em;line-height:1.03}
.ch06-headline.current{color:var(--secondary)}
.ch06-numeral-note{font-size:clamp(13px,1vw,18px);font-weight:800;line-height:1.3;color:var(--text-muted);margin:-3px 0 0}
.ch06-claim{border-radius:11px;padding:12px 14px;background:#f5f8f9;border:1px solid #e0e8eb;display:flex;flex-direction:column;gap:5px}
.ch06-claim b{font-size:clamp(12px,.91vw,16px);color:var(--primary)}
.ch06-claim p{font-size:clamp(14px,1.02vw,19px);line-height:1.48;margin:0}
.ch06-limit{display:flex;gap:8px;flex-direction:column;padding:11px 13px;background:#fff7f1;border-left:4px solid var(--accent-orange);border-radius:0 8px 8px 0}
.ch06-limit b,.ch06-agent b{font-size:clamp(12px,.9vw,16px);color:#ad592c}
.ch06-limit span,.ch06-agent span{font-size:clamp(13px,.94vw,17px);line-height:1.43}
.ch06-agent{display:flex;gap:7px;flex-direction:column;padding:10px 12px;background:var(--secondary-soft);border-left:4px solid var(--secondary);border-radius:0 8px 8px 0}
.ch06-agent b{color:var(--secondary)}
.ch06-sourceline{font-size:clamp(11px,.81vw,14px);line-height:1.35;color:var(--text-muted);margin-top:auto;padding-top:2px;display:flex;gap:7px;align-items:baseline;flex-wrap:wrap}
.ch06-sourceline a{color:#255b88;text-underline-offset:3px;font-weight:700}
.ch06-print-only{display:none}
@media (min-width:901px) and (max-height:810px){
 .ch06-visual{gap:7px}
 .ch06-chain{gap:7px}
 .ch06-level{min-height:150px;padding:9px 9px 8px}
 .ch06-level-title{margin-top:7px}
 .ch06-level-value{padding-top:7px}
 .ch06-statement{padding:10px 12px;gap:3px}
 .ch06-context{padding:8px 10px;gap:6px}
 .ch06-detail-card{gap:6px}
 .ch06-detail-card .ch06-headline{font-size:clamp(36px,3.4vw,51px)}
 .ch06-claim{padding:8px 10px}
 .ch06-claim p{line-height:1.37}
 .ch06-limit,.ch06-agent{padding:7px 10px;gap:4px}
 .ch06-sourceline{font-size:11px}
}
@media (max-width:900px){
 .ch06-main{grid-template-columns:1fr}
 .ch06-chain{min-height:190px}
 .ch06-detail-card{min-height:0}
}
@media (max-width:620px){
 .ch06-chain{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
 .ch06-level{min-height:145px}
 .ch06-level-value{font-size:23px}
 .ch06-context{flex-direction:column;gap:4px}
 .ch06-switch-btn{white-space:normal;font-size:13px;padding:9px}
 .ch06-flow-track{display:none}
}
@media (prefers-reduced-motion:reduce){.ch06-flow-track span{animation:none}.ch06-level{transition:none}}
@media print{
 #print-root .page[data-index="5"] .ch06-main{grid-template-columns:minmax(0,1.28fr) minmax(0,.94fr)!important;gap:14px!important}
 #print-root .page[data-index="5"] .ch06-visual{gap:8px!important}
 #print-root .page[data-index="5"] .ch06-detail-card{gap:7px!important}
 #print-root .page[data-index="5"] .ch06-level{min-height:134px!important;padding:9px!important;transform:none!important}
 #print-root .page[data-index="5"] .ch06-level-value{font-size:20px!important}
 #print-root .page[data-index="5"] .ch06-level-title{font-size:17px!important;margin-top:5px!important}
 #print-root .page[data-index="5"] .ch06-headline{font-size:43px!important}
 #print-root .page[data-index="5"] .ch06-claim{padding:10px 12px!important}
 #print-root .page[data-index="5"] .ch06-claim p{font-size:16px!important;line-height:1.35!important}
 #print-root .page[data-index="5"] .ch06-limit,#print-root .page[data-index="5"] .ch06-agent{padding:8px 10px!important;gap:4px!important}
 #print-root .page[data-index="5"] .ch06-limit span,#print-root .page[data-index="5"] .ch06-agent span{font-size:15px!important;line-height:1.32!important}
 #print-root .page[data-index="5"] .ch06-switch{display:none!important}
 #print-root .page[data-index="5"] .ch06-context{display:none!important}
 #print-root .page[data-index="5"] .ch06-flow-track{display:none!important}
 #print-root .page[data-index="5"] .ch06-print-only{display:block!important;border:1px solid #bcd6cc;background:#eff8f4;padding:8px 12px;border-radius:10px}
 #print-root .page[data-index="5"] .ch06-print-only strong{font-size:15px;color:#18766c}
 #print-root .page[data-index="5"] .ch06-print-only p{font-size:14px;line-height:1.25;margin:4px 0 0}
 #print-root .page[data-index="5"] .ch06-statement{padding:9px 11px!important}
 #print-root .page[data-index="5"] .ch06-statement strong{font-size:20px!important}
 #print-root .page[data-index="5"] .ch06-statement span{font-size:14px!important}
 #print-root .page[data-index="5"] .footnote{font-size:10px!important;line-height:1.35!important}
}

  
/* Content-led SVG illustrations occupy the once-empty center of every evidence card. */
.ch06-level-icon{display:flex;justify-content:center;align-items:center;width:100%;flex:1;min-height:30px;max-height:105px;padding:7px 0;pointer-events:none;color:#8f5961}
.ch06-level-icon svg{display:block;width:clamp(50px,5.7vw,90px);height:clamp(50px,5.7vw,90px);max-width:100%;opacity:.82}
.ch06-level.modern .ch06-level-icon{color:#477e80}
.ch06-level.selected .ch06-level-icon{color:var(--primary)}
@media (min-width:901px) and (max-height:810px){
 .ch06-level-icon{min-height:64px;padding:4px 0;max-height:113px}
 .ch06-level-icon svg{width:clamp(72px,7.2vw,105px);height:clamp(72px,7.2vw,105px)}
}

@media print{#print-root .page[data-index="5"] .ch06-level-icon{max-height:100px!important;min-height:65px!important;padding:2px!important}#print-root .page[data-index="5"] .ch06-level-icon svg{width:78px!important;height:78px!important}}

/* Chapter 11 controls reuse the existing Academic Interactive Presentation tokens. */

.discussion-actions .discussion-storage-note{font-size:11px;line-height:1.35;align-self:center}
@media (min-width:901px) and (max-height:810px){

}

/* S10 strategy diagram: left/right interaction and original brand palette. */
.s10-diagram{width:100%;max-height:min(43vh,395px);min-height:0;flex:1 1 auto}
.s10-academic,.s10-industry,.s10-core{transform-box:fill-box;transform-origin:center;transition:opacity .25s ease,transform .25s ease}
.s10-academic rect,.s10-industry rect,.s10-core rect{transition:stroke .25s ease,stroke-width .25s ease}
.s10-original-active{transform:scale(1.025)}
.s10-original-active rect{stroke:var(--primary);stroke-width:4;filter:drop-shadow(0 1px 3px #7d212a33)}
.s10-industry.s10-applied-active rect{stroke:var(--primary);stroke-width:3.5}
.s10-core.s10-applied-active rect{stroke:var(--secondary);stroke-width:3.5}
.s10-core-dim{opacity:.45}
.s10-moving-flow{animation:s10flow 1.8s linear infinite}
@keyframes s10flow{to{stroke-dashoffset:-30}}
.s10-pill{cursor:pointer;outline:none}
.s10-pill rect{fill:#fff;stroke:#a8d1c4;stroke-width:1.4;transition:fill .16s ease}
.s10-pill text{fill:var(--secondary);pointer-events:none}
.s10-pill:is(:hover,:focus-visible,.s10-pill-active) rect{fill:var(--secondary);stroke:var(--secondary)}
.s10-pill:is(:hover,:focus-visible,.s10-pill-active) text{fill:#fff}
.s10-outcome{display:flex;align-items:center;gap:10px;padding:9px 11px;background:var(--secondary-soft);border:1px solid #b8d9d0;border-radius:10px;line-height:1.35;min-height:46px;flex-wrap:wrap}
.s10-outcome strong{color:var(--primary);font-size:clamp(15px,1.15vw,19px);white-space:nowrap}
.s10-outcome [data-s10-hint]{font-size:clamp(13px,1vw,17px);font-weight:650;color:#126458;flex:1;min-width:170px}
.s10-practice{border-radius:10px;border:1px solid;padding:11px 13px}
.s10-practice .tag{font-size:11px}
.s10-practice p{margin:5px 0 0;font-size:clamp(14px,1vw,18px);font-weight:700;line-height:1.42}
.s10-practice-green{background:var(--secondary-soft);border-color:#b5dad0;color:#126458}
.s10-practice-red{background:var(--primary-soft);border-color:#e5c3c4;color:#7d212a}
@media (min-width:901px) and (max-height:810px){
 .presentation-main .page[data-index="9"]{gap:6px}

 .presentation-main .page[data-index="9"] .s10-right .detail{flex:0 0 auto;min-height:0;padding:10px 12px}
 .presentation-main .page[data-index="9"] .s10-right .detail p{line-height:1.32}

 .presentation-main .page[data-index="9"] .s10-right .inline-foot{padding:7px 9px;font-size:clamp(12px,.9vw,15px);line-height:1.3}
 .presentation-main .page[data-index="9"] .s10-practice{padding:8px 10px}
 .presentation-main .page[data-index="9"] .s10-practice p{font-size:clamp(13px,.94vw,16px);line-height:1.3}
 .presentation-main .page[data-index="9"] .s10-diagram{max-height:41vh}
 .presentation-main .page[data-index="9"] .s10-outcome{padding:6px 9px;min-height:40px}
 .presentation-main .page[data-index="9"] .legend{margin:0}
}

@media print{
 #print-root .page[data-index="9"] .s10-diagram{max-height:300px!important}
 #print-root .page[data-index="9"] .s10-practice{padding:9px 11px!important}
 #print-root .page[data-index="9"] .s10-practice p{font-size:15px!important;line-height:1.35!important}
 #print-root .page[data-index="9"] .s10-right{gap:8px!important}
 #print-root .page[data-index="9"] .s10-right .detail{flex:0 0 auto!important;padding:11px!important}

}
@media(prefers-reduced-motion:reduce){.s10-moving-flow{animation:none}}

</style>

    document.querySelectorAll('.chapter-page[data-index="9"] .s10-pill').forEach(n=>n.classList.toggle('s10-pill-active',n.dataset.value===key));
  }
  document.addEventListener('pointerover',e=>{const n=e.target.closest?.('.s10-pill[data-value]');if(n)refreshS10Focus(n.dataset.value);});
  document.addEventListener('pointerout',e=>{const n=e.target.closest?.('.s10-pill[data-value]');if(n&&!n.contains(e.relatedTarget))refreshS10Focus();});
  document.addEventListener('focusin',e=>{const n=e.target.closest?.('.s10-pill[data-value]');if(n)refreshS10Focus(n.dataset.value);});
  document.addEventListener('focusout',e=>{const n=e.target.closest?.('.s10-pill[data-value]');if(n)refreshS10Focus();});
  function updateDiscussionPreview(){document.querySelectorAll('#discussion-preview').forEach(el=>el.textContent=discussionText());}
  async function copyAnswer(){try{if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(discussionText());}else{const t=document.createElement('textarea');t.value=discussionText();document.body.appendChild(t);t.select();if(!document.execCommand('copy'))throw new Error('copy');t.remove();}toast('已複製回答。');}catch(e){toast('瀏覽器限制複製，請手動選取回答文字。');}}
  let toastTimeout;function toast(s){$('toast').textContent=s;$('toast').classList.add('show');clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>$('toast').classList.remove('show'),2700);}
  function showPrint(){const root=$('print-root');root.innerHTML=PAGES.map((p,i)=>renderers[i]()).join('');try{window.print();}catch(e){toast('無法呼叫列印。請使用瀏覽器列印功能並選擇「儲存為 PDF」。');}}
  document.addEventListener('click',async e=>{const target=e.target.closest('[data-action]');if(!target)return;const action=target.dataset.action;const val=target.dataset.value;switch(action){
    case 'open-menu':$('sidebar').classList.add('open');$('mobile-backdrop').classList.add('show');break;
    case 'close-menu':$('sidebar').classList.remove('open');$('mobile-backdrop').classList.remove('show');break;
    case 'goto':goTo(Number(val));$('sidebar').classList.remove('open');$('mobile-backdrop').classList.remove('show');break;
    case 'prev':goTo(state.page-1);break;case 'next':goTo(state.page+1);break;
    case 'toggle-layout':toggleLayout();break;case 'present':enterPresent();break;case 'exit-present':exitPresent();break;
    case 'open-glossary':openGlossary();break;case 'close-glossary':closeGlossary();break;case 'print':showPrint();break;
    case 'ability':state.ability=Number(val);patch(1);break;
    case 'reading':state.reading=Number(val);state.readingMode='roles';patch(2);break;case 'reading-mode':state.readingMode=val==='guardrails'?'guardrails':'roles';patch(2);break;case 'reading-play':toggleReading();break;
    case 'reuse':state.reuse=val;state.reuseStep=0;patch(3);break;case 'reuse-step':state.reuseStep=Math.min(2,Math.max(0,Number(val)));patch(3);break;case 'gate':state.gate=Number(val);patch(4);break;case 'risk':state.risk=val==='on';patch(4);break;
    case 'battery-era':state.batteryEra=val==='current'?'current':'book';patch(5);break;case 'battery':state.battery=Number(val);patch(5);break;case 'battery-prev':state.battery=Math.max(0,state.battery-1);patch(5);break;case 'battery-next':state.battery=Math.min(3,state.battery+1);patch(5);break;
    case 'criterion':state.criterion=Number(val);patch(6);break;case 'knowledge-case':state.knowledgeCase=['biomedical','fpga','leo'].includes(val)?val:'biomedical';patch(6);break;case 'field':state.field=Number(val);patch(7);break;case 'conclusion':state.conclusion=val;patch(9);break;case 's10-focus':if(['review','integrate','validate'].includes(val)){state.conclusionFocus=val;refreshS10Focus();}break;
    case 'start-timer':startTimer(Number(val));break;case 'pause-timer':pauseTimer();break;case 'reset-timer':stopTimer();state.seconds=0;patch(10);break;case 'fill-5g-demo':applyDiscussion(DISCUSSION_DEMO);toast('已帶入 5G 研究示範。');break;case 'clear-discussion':applyDiscussion({delegate:'',hold:'',proof:''});toast('已清空，請填入自己的研究題目。');break;case 'copy-answer':await copyAnswer();break;
  }});
  document.addEventListener('input',e=>{if(e.target.id==='glossary-search')drawGlossary();if(e.target.dataset.discussion){state.discussion[e.target.dataset.discussion]=e.target.value;updateDiscussionPreview();saveDiscussion();}if(e.target.id==='balance-range'){state.balance=Number(e.target.value);document.querySelectorAll('#balance-left').forEach(n=>n.style.width=(100-state.balance)+'%');document.querySelectorAll('#balance-right').forEach(n=>n.style.width=state.balance+'%');const msg=state.balance<30?'過度偏向點子，可能低估量產與驗證風險。':state.balance>70?'過度偏向檢核，可能讓探索性創意難以啟動。':'設計想像與驗證工程互相補位，使創意真正可被採用。';document.querySelectorAll('#balance-desc p').forEach(n=>n.textContent=msg);}});
  document.addEventListener('keydown',e=>{const target=e.target;const editing=target.closest('input,textarea,select,[contenteditable=true]');if(e.key==='Escape'){if($('glossary').classList.contains('show')){closeGlossary();return;}if(state.presenting){exitPresent();return;}if($('sidebar').classList.contains('open')){$('sidebar').classList.remove('open');$('mobile-backdrop').classList.remove('show');return;}}if(editing)return;
   if((e.key==='Enter'||e.key===' ')&&e.target.closest('[role=button][data-action]')){e.preventDefault();e.target.closest('[role=button]').dispatchEvent(new MouseEvent('click',{bubbles:true}));return;}
   if(!$('glossary').classList.contains('show')&&(state.layout==='single'||state.presenting)){if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();goTo(state.page+1);}if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();goTo(state.page-1);}}
  });
  $('glossary').addEventListener('click',e=>{if(e.target===$('glossary'))closeGlossary();});
  document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&state.presenting){state.presenting=false;$('presentation').classList.remove('show');render();}});
  window.addEventListener('beforeprint',()=>{if(!$('print-root').innerHTML)$('print-root').innerHTML=PAGES.map((p,i)=>renderers[i]()).join('');});
  window.addEventListener('afterprint',()=>{$('print-root').innerHTML='';});
  window.addEventListener('hashchange',()=>{const target=PAGES.findIndex(p=>'#'+p.code.toLowerCase()===location.hash.toLowerCase());if(target>=0&&target!==state.page)goTo(target);});
  const start=PAGES.findIndex(p=>'#'+p.code.toLowerCase()===location.hash.toLowerCase());if(start>=0)state.page=start;
  render();
  // 連網時非阻塞載入設計字型，離線開啟時系統字型立即可用。
  if(navigator.onLine){const font=document.createElement('link');font.rel='stylesheet';font.href='https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700;800&display=swap';document.head.appendChild(font);}
  </script>
</body>
</html>
